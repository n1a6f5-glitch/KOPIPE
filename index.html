<!doctype html>
<html lang="en" data-theme="obsidian">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d13">
<title>KOPIPE</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<style>
:root,[data-theme="obsidian"]{--bg:#0b0d13;--panel:rgba(18,22,32,.84);--panel-solid:#121620;--panel2:rgba(26,32,48,.9);--line:rgba(56,68,96,.65);--ink:#eceef2;--dim:#94a0b8;--amber:#f59e0b;--mint:#10b981;--red:#ef4444;--blue:#38bdf8;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--bg-img:url('icons/vn-bg.svg');--bg-dim:.76}
[data-theme="navy"]{--bg:#08101e;--panel:rgba(14,26,48,.84);--panel-solid:#0f1b31;--panel2:rgba(22,38,68,.9);--line:rgba(46,75,130,.65);--ink:#e8f1ff;--dim:#8ea8d1;--amber:#38bdf8;--mint:#34d399;--red:#f87171;--blue:#60a5fa}
[data-theme="crimson"]{--bg:#100a0e;--panel:rgba(26,17,23,.84);--panel-solid:#1a1117;--panel2:rgba(38,24,34,.9);--line:rgba(76,46,66,.65);--ink:#f3e8ee;--dim:#ab8f9f;--amber:#f43f5e;--mint:#10b981;--red:#fb7185;--blue:#c084fc}
*{box-sizing:border-box}
html{min-height:100vh;background:var(--bg)}
body{margin:0;min-height:100vh;background:transparent;color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
/* Full-Screen Visual Novel Wallpaper Backdrop */
#vn-bg{position:fixed;inset:0;background-image:var(--bg-img);background-size:cover;background-position:center var(--bg-pos, top);background-repeat:no-repeat;z-index:-2;pointer-events:none}
#vn-bg-dim{position:fixed;inset:0;background:var(--bg);opacity:var(--bg-dim);backdrop-filter:blur(var(--bg-blur, 0px));z-index:-1;pointer-events:none;transition:opacity .2s}
/* Unified Header (No Icon Logo) */
header{display:flex;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(11,13,19,.92);backdrop-filter:blur(12px);z-index:10}
header b{font:800 15px var(--mono);letter-spacing:3px;color:var(--amber)}
.sys-sub{font:600 10.5px var(--mono);color:var(--dim);letter-spacing:1.2px;border-left:1px solid var(--line);padding-left:10px}
#crumb{color:var(--ink);font:600 11.5px var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;min-width:0;padding:3px 10px;border-radius:3px;border:1px solid var(--line);background:var(--panel)}
#crumb:empty{display:none}
#crumb:hover{border-color:var(--amber);color:var(--amber)}
#prog{margin-left:auto;font:600 11.5px var(--mono);color:var(--dim);white-space:nowrap;letter-spacing:.5px}
#upd{border-radius:3px;padding:4px 10px;font:600 11.5px var(--mono);letter-spacing:.5px}
#upd[hidden]{display:none!important}
#bar{height:2px;background:var(--line)}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--mint));transition:width .25s}
nav{display:flex;gap:5px;padding:7px 18px;border-bottom:1px solid var(--line);position:sticky;top:43px;background:rgba(11,13,19,.88);backdrop-filter:blur(12px);z-index:9;overflow-x:auto}
nav button{border:1px solid var(--line);border-radius:3px;background:var(--panel);color:var(--dim);padding:6px 13px;white-space:nowrap;font:600 11.5px var(--mono);letter-spacing:.8px}
nav button:hover{color:var(--ink);border-color:var(--amber)}
nav button.on{color:#0b0d13;background:var(--amber);border-color:var(--amber);font-weight:700}
main{max-width:960px;margin:0 auto;padding:16px}
select,button,input,textarea{background:var(--panel-solid);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:7px 10px;font:inherit;transition:border-color .12s,background .12s}
select:focus,input:focus,textarea:focus{outline:none;border-color:var(--amber)}
button{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;font-weight:500;font-size:13px}
button:hover{background:var(--panel2);border-color:var(--amber)}
button.pri{background:var(--amber);color:#0b0d13;border-color:var(--amber);font-weight:600}
button.pri:hover{filter:brightness(1.08)}
button.sm{padding:4px 9px;font-size:12px;border-radius:3px}
button.danger{color:var(--red);border-color:rgba(239,68,68,.35)}
button.danger:hover{background:rgba(239,68,68,.12);border-color:var(--red)}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=file]{display:none}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.grow{flex:1;min-width:180px}
/* VN Save/Load Slot Card */
.proj{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-left:3px solid var(--amber);border-radius:4px;padding:12px 14px;margin-bottom:8px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px}
.proj:hover{background:var(--panel2);border-color:var(--amber)}
.slot-no{font:700 11px var(--mono);color:var(--amber);background:rgba(245,158,11,.12);border:1px solid rgba(245,158,11,.35);padding:2px 7px;border-radius:3px;letter-spacing:.8px}
.meter{height:5px;width:96px;background:var(--line);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--mint)}
/* VN System Config Panels */
.panel-card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-head b{font:700 12px var(--mono);letter-spacing:1px;text-transform:uppercase;color:var(--amber)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field > span{font:600 11px var(--mono);color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
.field > input,.field > select{width:100%;background:var(--panel-solid)}
/* Live VN Scene & Textbox Preview */
.vn-preview-wrap{position:sticky;top:85px;z-index:8;margin-bottom:12px}
.vn-stage{background-image:var(--bg-img);background-size:cover;background-position:center var(--bg-pos, 22%);border:1px solid var(--amber);border-radius:4px;min-height:var(--stage-h, 280px);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(0,0,0,.65);transition:min-height .2s}
.vn-stage::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,19,.04) 0%,rgba(11,13,19,.35) 45%,rgba(11,13,19,.88) 100%);pointer-events:none}
.vn-box{background:rgba(11,13,19,.88);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.16);border-top:2px solid var(--amber);border-radius:3px;padding:12px 16px 10px;position:relative;z-index:1}
.vn-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.vn-nameplate{font:700 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#0b0d13;background:var(--amber);padding:2px 12px;border-radius:2px;letter-spacing:.4px;display:inline-block}
.vn-nameplate.narasi{background:var(--panel-solid);color:var(--dim);border:1px solid var(--line);font-weight:600}
.vn-meta{font:11px var(--mono);color:var(--dim)}
.vn-text{font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;color:#f8fafc;white-space:pre-wrap;word-break:break-word;min-height:44px;letter-spacing:.15px;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.vn-src-sub{font:12px/1.4 var(--mono);color:var(--dim);margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);white-space:pre-wrap}
/* VN Backlog Cards */
.card{background:var(--panel);backdrop-filter:blur(8px);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:4px;padding:10px 12px;margin-bottom:8px}
.card.s-done{border-left-color:var(--mint)}.card.s-draft{border-left-color:var(--blue)}.card.s-flag{border-left-color:var(--red)}
.card .h{display:flex;align-items:center;gap:8px;font:11.5px var(--mono);color:var(--dim);margin-bottom:6px;flex-wrap:wrap}
.badge{background:var(--panel2);padding:1px 6px;border-radius:3px;border:1px solid var(--line);font:600 10.5px var(--mono);color:var(--dim);letter-spacing:.5px;text-transform:uppercase}
.badge.k-dialog{color:var(--blue);border-color:rgba(56,189,248,.35);background:rgba(56,189,248,.1)}
.badge.k-narasi{color:var(--dim);border-color:var(--line);background:var(--panel-solid)}
.badge.k-choice{color:var(--warn);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.12)}
.spk-badge{color:#0b0d13;background:var(--amber);padding:1px 8px;border-radius:2px;font:700 11.5px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.st{margin-left:auto;font:600 10.5px var(--mono);color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
.card.s-done .st{color:var(--mint)}
.card.s-draft .st{color:var(--blue)}
.card.s-flag .st{color:var(--red)}
.src{background:rgba(11,13,19,.75);padding:7px 10px;border-radius:3px;border:1px solid var(--line);font:13px/1.45 var(--mono);white-space:pre-wrap;word-break:break-word;margin-bottom:6px;color:#d1d5db}
.src .tag{color:var(--amber);background:rgba(245,158,11,.14);padding:0 3px;border-radius:2px;cursor:pointer;font-size:11.5px}
textarea{width:100%;resize:vertical;font-family:inherit;line-height:1.45;background:rgba(11,13,19,.8)}
.card input.nm{width:160px;padding:4px 8px;font-size:12px;background:rgba(11,13,19,.8)}
.card .act{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--red);margin-top:4px}
.chip{border-radius:3px;padding:4px 10px;font:600 11.5px var(--mono);background:var(--panel);color:var(--dim);letter-spacing:.3px}
.chip.on{background:var(--panel2);color:var(--amber);border-color:var(--amber)}
.pill-chk{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:5px 10px;font:500 12px var(--mono);color:var(--dim);cursor:pointer;user-select:none}
.pill-chk:hover{color:var(--ink);border-color:var(--amber)}
/* VN Option Row in Config */
.cfg-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.cfg-row:last-child{border-bottom:0}
.cfg-lbl{font:600 12px var(--mono);letter-spacing:.6px;text-transform:uppercase;color:var(--ink)}
.cfg-sub{font-size:12px;color:var(--dim);margin-top:2px}
.opt-group{display:flex;gap:4px;flex-wrap:wrap}
table{width:100%;border-collapse:collapse;margin:8px 0}
td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13.5px}
.drop{border:1px dashed var(--line);border-radius:4px;padding:18px;text-align:center;cursor:pointer;background:var(--panel);backdrop-filter:blur(8px);display:block;margin-bottom:10px}
.drop:hover,.drop.over{border-color:var(--amber);background:var(--panel2)}
#toast{position:fixed;bottom:16px;right:16px;background:var(--panel-solid);border:1px solid var(--amber);color:var(--ink);padding:8px 14px;border-radius:4px;font:500 12.5px var(--mono);box-shadow:0 4px 12px rgba(0,0,0,.5);z-index:99;display:none}
#toast.on{display:block}
label.f{display:block;margin-bottom:10px;font-weight:500;font-size:13px}label.f input,label.f select{display:block;width:100%;margin-top:4px;background:var(--panel-solid)}
.dim{color:var(--dim);font-size:12.5px}
.ok{color:var(--mint)}.warn{color:var(--amber)}.err{color:var(--red)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot.ok{background:var(--mint)}.dot.warn{background:var(--amber)}.dot.error{background:var(--red)}
.folder-hdr{background:var(--panel2);cursor:pointer;user-select:none;font-weight:600}
.folder-hdr:hover{border-color:var(--amber)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:80;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--panel-solid);border:1px solid var(--amber);border-radius:4px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.modal-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.modal-b{padding:12px 14px;overflow-y:auto;font:12px/1.45 var(--mono);flex:1}
.log-step{border:1px solid var(--line);border-radius:4px;margin-bottom:8px;background:var(--bg)}
.log-step summary{padding:6px 10px;cursor:pointer;font-weight:600;color:var(--ink);background:var(--panel2);border-radius:4px}
.log-line{padding:4px 10px;border-top:1px solid var(--line);white-space:pre-wrap;word-break:break-word}
.prog-box{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:8px 0}
</style>
</head>
<body>
<div id="vn-bg"></div>
<div id="vn-bg-dim"></div>
<header><b>KOPIPE</b><span class="sys-sub">VN SCRIPT SYSTEM</span><span id="crumb"></span><span id="prog"></span><button id="upd" class="sm pri" title="New version available — click to reload" hidden>UPDATE</button></header>
<div id="bar"><i></i></div>
<nav id="nav" hidden></nav>
<main id="view"></main>
<div id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
